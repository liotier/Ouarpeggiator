name: Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  unit:
    name: Sequencer core & Euclidean generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The suite is dependency-free (node:test + node:assert against the pure
      # ES modules), so there is nothing to install.
      - name: Run tests
        run: npm test
